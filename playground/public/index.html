<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fish Playground</title>
<style>
  :root { --bg: #fbfbf9; --fg: #1d1f21; --muted: #6b6f75; --line: #dcdcd6; --panel: #ffffff; --accent: #1f6feb; --error: #c62828; --warning: #9a6700; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171a; --fg: #e6e6e3; --muted: #9aa0a6; --line: #2c3036; --panel: #1c1f23; --accent: #58a6ff; --error: #ff7b72; --warning: #d29922; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  header { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  button { font: inherit; padding: 4px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #status { color: var(--muted); }
  #link { flex: 1; min-width: 200px; font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); height: calc(100vh - 53px); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } #source { min-height: 50vh; } }
  #source { width: 100%; height: 100%; border: 0; padding: 12px 16px; resize: none; background: var(--panel); color: var(--fg); font: 14px/1.5 ui-monospace, Menlo, monospace; tab-size: 2; outline: none; }
  aside { background: var(--bg); overflow: auto; padding: 12px 16px; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
  aside h2:first-child { margin-top: 0; }
  pre { margin: 0; white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, monospace; }
  #problems { list-style: none; margin: 0; padding: 0; font: 13px/1.5 ui-monospace, Menlo, monospace; }
  #problems li { padding: 2px 0; }
  #problems li.error { color: var(--error); }
  #problems li.warning { color: var(--warning); }
  #problems button { padding: 0 6px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Fish Playground</h1>
  <button id="run" class="primary" title="Ctrl+Enter">Run</button>
  <button id="share">Share</button>
  <span id="status"></span>
  <input id="link" readonly hidden aria-label="share link">
</header>
<main>
  <textarea id="source" spellcheck="false" aria-label="program"></textarea>
  <aside>
    <h2>Output</h2>
    <pre id="output"></pre>
    <h2>Problems</h2>
    <ul id="problems"></ul>
    <h2>Ownership</h2>
    <pre id="explain"></pre>
  </aside>
</main>
<script src="playground.js"></script>
</body>
</html>
