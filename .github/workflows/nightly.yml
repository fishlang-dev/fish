# Builds a nightly fishc tarball for each target stage0.toml has a released stage 0 for and keeps
# them as the run's artifacts.
name: nightly
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  nightly:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fish/stage0
          key: stage0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('stage0.toml') }}
      - name: Build
        run: sh scripts/bootstrap.sh
      - id: host
        run: |
          arch=$(uname -m); case "$arch" in x86_64) arch=x64 ;; aarch64) arch=arm64 ;; esac
          echo "host=$arch-$(uname -s | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - run: build/fishc run scripts/release.fsh -- --nightly
      - uses: actions/upload-artifact@v4
        with:
          name: fishc-nightly-${{ steps.host.outputs.host }}
          path: dist/*.tar.gz*
