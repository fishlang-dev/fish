# Builds fishc from source with the pinned stage 0 and runs its tests. Run by hand while CI is
# off; add push and pull_request triggers when it comes back. Bun is needed only to build stage 0
# from its pinned commit, when the cache has none.
name: self-hosting
on: workflow_dispatch
jobs:
  selfhost:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: sh scripts/bootstrap.sh
      - run: build/fishc run tests/run.fsh -- --fishc "$PWD/build/fishc"
      - run: cd tests/unit && FISHC="$PWD/../../build/fishc" ../../build/fishc test --release
