# Builds fishc from source with the pinned stage 0 and runs its tests, on each target stage0.toml
# has a released stage 0 for. It runs on a pull request from a release branch into main, which is
# the check a release is merged on, and by hand; no push starts it.
name: self-hosting
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: selfhost-${{ github.ref }}
  cancel-in-progress: true
jobs:
  selfhost:
    # A fork's pull request never runs here: a fork can name a branch release/v* too.
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'release/v') && github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        # Another target joins once stage0.toml has its digest and tarball: building its stage 0
        # from source goes back through compilers that need more memory than a runner has.
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The unit tests still run Bun as a peer, for the language server's driver and npm bundling,
      # and ask Node what std's fs, path, util and console calls should give. Each is pinned to the
      # version std's behaviour is checked against, since another prints otherwise.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - name: Libraries fishc links, and what the tests build and run
        if: runner.os == 'Linux'
        # The last is the sanitizer runtimes of the image's clang, named by its version, which the
        # x86-64 image leaves out.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev zlib1g-dev libsqlite3-dev zip unzip "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fish/stage0
          key: stage0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('stage0.toml') }}
      - name: Build
        id: build
        run: sh scripts/bootstrap.sh
      - name: Golden programs
        run: build/fishc run tests/run.fsh -- --fishc "$PWD/build/fishc"
      # Run whatever the golden programs did, so one run shows every failure. A test with no limit
      # of its own gets a minute, not ten seconds: the slowest runner takes several times as long
      # as the machine the tests are written on.
      - name: Unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cd tests/unit && FISHC="$PWD/../../build/fishc" ../../build/fishc test --release --timeout 60000
