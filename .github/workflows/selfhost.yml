# Builds fishc from source with the pinned stage 0 and runs its tests, on each target fishc runs on.
# Bun is needed only to build stage 0 from its pinned commit, when the cache has none.
name: self-hosting
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: selfhost-${{ github.ref }}
  cancel-in-progress: true
jobs:
  selfhost:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      # Stage 0 takes over an hour to build from source and changes only with stage0.toml.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fish/stage0
          key: stage0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('stage0.toml') }}
      # A target stage0.toml has no digest for can't check a cached stage 0, so it builds stage 0
      # from source and records the digest, kept as an artifact to be committed into stage0.toml.
      - name: Bootstrap
        id: bootstrap
        run: |
          arch=$(uname -m); case "$arch" in x86_64) arch=x64 ;; aarch64) arch=arm64 ;; esac
          host="$arch-$(uname -s | tr '[:upper:]' '[:lower:]')"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          if grep -q "^\"$host\" = " stage0.toml; then sh scripts/bootstrap.sh; else sh scripts/bootstrap.sh --record; fi
      - uses: actions/upload-artifact@v4
        with:
          name: stage0-${{ steps.bootstrap.outputs.host }}
          path: stage0.toml
      - run: build/fishc run tests/run.fsh -- --fishc "$PWD/build/fishc"
      - run: cd tests/unit && FISHC="$PWD/../../build/fishc" ../../build/fishc test --release
