# Builds fishc from source with the pinned stage 0 and runs its tests, on each target stage0.toml
# has a released stage 0 for. It runs on a pull request from a release branch into main, which is
# the check a release is merged on, and by hand; no push starts it.
name: self-hosting
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: selfhost-${{ github.ref }}
  cancel-in-progress: true
jobs:
  selfhost:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
    strategy:
      fail-fast: false
      matrix:
        # Another target joins once stage0.toml has its digest and tarball: building its stage 0
        # from source goes back through compilers that need more memory than a runner has.
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The unit tests still run Bun as a peer: the language server's driver and npm bundling.
      # Pinned to the Bun std's behaviour is checked against, since a later one prints otherwise.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fish/stage0
          key: stage0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('stage0.toml') }}
      - name: Build
        run: sh scripts/bootstrap.sh
      - name: Golden programs
        run: build/fishc run tests/run.fsh -- --fishc "$PWD/build/fishc"
      - name: Unit tests
        run: cd tests/unit && FISHC="$PWD/../../build/fishc" ../../build/fishc test --release
