name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The v1 platforms: Linux and macOS, on x86-64 and ARM64.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-15
            platform: macos-arm64
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Builds the Math runtime once per job into a directory the cache step keeps.
      FISH_CACHE_DIR: ${{ github.workspace }}/.fish-cache
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Toolchain
        run: |
          clang --version
          bun --version

      - name: Math runtime cache
        uses: actions/cache@v4
        with:
          path: .fish-cache
          key: fish-math-${{ matrix.platform }}-${{ hashFiles('vendor/**', 'src/runtime/**', 'src/mathlib.ts') }}

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test
