# Publishes a release when its tag is pushed: the tagged commit's fishc packed for each target fishc
# runs on, attached with their sha256s, and the tag's CHANGELOG.md section as the notes. The tag and
# its release commit come from `fishc run scripts/release.fsh -- <version>`.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  pack:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fish/stage0
          key: stage0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('stage0.toml') }}
      - name: Bootstrap
        id: bootstrap
        run: |
          arch=$(uname -m); case "$arch" in x86_64) arch=x64 ;; aarch64) arch=arm64 ;; esac
          host="$arch-$(uname -s | tr '[:upper:]' '[:lower:]')"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          if grep -q "^\"$host\" = " stage0.toml; then sh scripts/bootstrap.sh; else sh scripts/bootstrap.sh --record; fi
      - run: build/fishc run scripts/release.fsh -- --pack "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: fishc-${{ steps.bootstrap.outputs.host }}
          path: dist/*.tar.gz*
  publish:
    needs: pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 --title "fishc $version" --notes-file notes.md
